name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Rebuild catalog and check for staleness
        run: |
          node scripts/build-skills-json.mjs
          git diff --exit-code docs/data/skills.json docs/index.html docs/install.html
      - name: Syntax-check JS
        run: |
          node --check scripts/build-skills-json.mjs
          node --check docs/assets/js/app.js
      - name: Validate YAML and JSON
        run: |
          pip install pyyaml
          python3 -c "import yaml,glob; [yaml.safe_load(open(f)) for f in glob.glob('.github/workflows/*.yml')]; print('yaml ok')"
          python3 -c "import json; json.load(open('docs/data/skills.json')); print('json ok')"
      - name: Check DOM IDs
        run: |
          grep -q 'id="skill-list"' docs/index.html
          grep -q 'id="search"' docs/index.html
          grep -q 'id="skill-count"' docs/index.html
          grep -q 'id="skill-picker"' docs/index.html
          grep -q 'id="skill-picker"' docs/install.html
